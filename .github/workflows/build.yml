name: Builds
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: linux-release-x86_64
            name: Linux Release x86_64
            runner: ubuntu-22.04
            target: template_release
            platform: linux
            arch: x86_64
          - identifier: windows-release-x86_64
            name: Windows Release x86_64
            runner: windows-2022
            target: template_release
            platform: windows
            arch: x86_64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        shell: bash
        run: |
          python -m pip install scons
          scons --version

      - name: Set up SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: ${{ matrix.identifier }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.identifier }}-${{ github.ref }}-
            ${{ matrix.identifier }}-

      - name: Compile extension
        shell: bash
        env:
          SCONS_CACHE: '${{ github.workspace }}/.scons-cache/'
          SCONS_CACHE_LIMIT: 4096
        run: |
          scons target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}' -j4
          ls -l demo/addons/voxel_playground/bin/

      - name: Package addon
        shell: bash
        run: |
          addon=demo/addons/voxel_playground
          # Strip MSVC link by-products; only the shared library is needed at runtime.
          rm -f $addon/bin/*.exp $addon/bin/*.lib $addon/bin/*.pdb $addon/bin/~*
          cp README.md LICENSE $addon/
          mkdir -p github-artifact/addons
          cp -r $addon github-artifact/addons/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.identifier }}
          path: github-artifact

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.ref_name }}
          delete-merged: true
